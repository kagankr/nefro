<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KBY'de Anemi Tedavisi Hesaplayıcı</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }
    /* Input focus ring custom color */
    .input-focus:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
    }
  </style>
</head>
<body class="bg-gray-100 p-4 flex items-center justify-center min-h-screen">
  <div id="root" class="w-full"></div>

  <script crossorigin src="https://unpkg.com/react@17/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Step 1: Patient Data Entry & Calculator
    const Step1 = ({ setStep, setPatientData }) => {
      const [hb, setHb] = useState('');
      const [ferritin, setFerritin] = useState('');
      
      // TSAT Calculation State
      const [tsatMode, setTsatMode] = useState('direct'); // 'direct' or 'calc'
      const [tsatInput, setTsatInput] = useState('');
      const [serumIron, setSerumIron] = useState('');
      const [tibc, setTibc] = useState('');
      const [calculatedTsat, setCalculatedTsat] = useState(null);

      // Effect to calculate TSAT automatically
      useEffect(() => {
        if (tsatMode === 'calc' && serumIron && tibc && parseFloat(tibc) > 0) {
          const val = (parseFloat(serumIron) / parseFloat(tibc)) * 100;
          setCalculatedTsat(val.toFixed(1)); // 1 decimal place
        } else {
          setCalculatedTsat(null);
        }
      }, [serumIron, tibc, tsatMode]);

      const handleAnalyze = () => {
        let finalTsat = null;
        
        // Determine final TSAT based on mode and inputs
        if (tsatMode === 'direct' && tsatInput !== '') {
            finalTsat = parseFloat(tsatInput);
        } else if (tsatMode === 'calc' && calculatedTsat !== null) {
            finalTsat = parseFloat(calculatedTsat);
        }
        
        // Validation: Only Hb and Ferritin are mandatory now
        if (!hb || !ferritin) {
          alert("Lütfen Hemoglobin ve Ferritin değerlerini giriniz.");
          return;
        }

        setPatientData({
          hb: parseFloat(hb),
          ferritin: parseFloat(ferritin),
          tsat: finalTsat // Can be null if not provided
        });
        setStep(2);
      };

      return (
        <div className="space-y-5 animate-fade-in">
          <div className="bg-blue-50 p-4 rounded-lg border-l-4 border-blue-600">
            <h3 className="font-bold text-lg text-blue-900 flex items-center gap-2">
              <span data-lucide="calculator" className="w-5 h-5"></span> Hasta Değerleri
            </h3>
            <p className="text-sm text-blue-800 mt-1">
              Tedavi algoritmasını başlatmak için değerleri giriniz.
            </p>
          </div>

          <div className="space-y-4">
            {/* Hemoglobin Input */}
            <div>
              <label className="block text-sm font-semibold text-gray-700 mb-1">Hemoglobin (g/dL) <span className="text-red-500">*</span></label>
              <input 
                type="number" 
                value={hb}
                onChange={(e) => setHb(e.target.value)}
                placeholder="Örn: 9.5"
                className="w-full p-3 border border-gray-300 rounded-lg input-focus transition-all"
              />
            </div>

            {/* Ferritin Input */}
            <div>
              <label className="block text-sm font-semibold text-gray-700 mb-1">Ferritin (µg/L) <span className="text-red-500">*</span></label>
              <input 
                type="number" 
                value={ferritin}
                onChange={(e) => setFerritin(e.target.value)}
                placeholder="Örn: 80"
                className="w-full p-3 border border-gray-300 rounded-lg input-focus transition-all"
              />
            </div>

            {/* TSAT Section */}
            <div className="bg-gray-50 p-4 rounded-lg border border-gray-200">
              <div className="flex justify-between items-center mb-3">
                <label className="text-sm font-semibold text-gray-700">TSAT (Opsiyonel)</label>
                <div className="flex bg-gray-200 rounded p-0.5">
                  <button 
                    onClick={() => setTsatMode('direct')}
                    className={`px-3 py-1 text-xs font-bold rounded transition-all ${tsatMode === 'direct' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500'}`}
                  >
                    Biliyorum
                  </button>
                  <button 
                    onClick={() => setTsatMode('calc')}
                    className={`px-3 py-1 text-xs font-bold rounded transition-all ${tsatMode === 'calc' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500'}`}
                  >
                    Hesapla
                  </button>
                </div>
              </div>

              {tsatMode === 'direct' ? (
                <div className="relative">
                  <input 
                    type="number" 
                    value={tsatInput}
                    onChange={(e) => setTsatInput(e.target.value)}
                    placeholder="Örn: 18 (Boş bırakılabilir)"
                    className="w-full p-3 border border-gray-300 rounded-lg input-focus"
                  />
                  <span className="absolute right-4 top-3 text-gray-400 font-bold">%</span>
                </div>
              ) : (
                <div className="space-y-3 animate-fade-in">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs text-gray-500 block mb-1">Serum Demir (µg/dL)</label>
                      <input 
                        type="number" 
                        value={serumIron}
                        onChange={(e) => setSerumIron(e.target.value)}
                        placeholder="Demir"
                        className="w-full p-2 border border-gray-300 rounded input-focus text-sm"
                      />
                    </div>
                    <div>
                      <label className="text-xs text-gray-500 block mb-1">TDBK (µg/dL)</label>
                      <input 
                        type="number" 
                        value={tibc}
                        onChange={(e) => setTibc(e.target.value)}
                        placeholder="Bağlama"
                        className="w-full p-2 border border-gray-300 rounded input-focus text-sm"
                      />
                    </div>
                  </div>
                  {calculatedTsat && (
                    <div className="bg-blue-100 text-blue-800 p-2 rounded text-center font-bold">
                      Hesaplanan TSAT: %{calculatedTsat}
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>

          <button 
            onClick={handleAnalyze}
            className="w-full bg-slate-800 hover:bg-black text-white font-bold py-4 px-4 rounded-xl flex items-center justify-center gap-2 transition-all shadow-lg transform hover:scale-[1.02]"
          >
            Sonuçları Analiz Et <span data-lucide="arrow-right" className="w-5 h-5"></span>
          </button>
        </div>
      );
    };

    // Step 2: Analysis Result
    const Step2 = ({ setStep, patientData, setIronStatus }) => {
      const { hb, ferritin, tsat } = patientData;
      
      // SUT Logic: 
      // 1. Ferritin < 100 -> Deficient (regardless of TSAT)
      // 2. TSAT < 20 (if provided) -> Deficient
      // If Ferritin >= 100 and TSAT is not provided, we assume "Replete" for the sake of the algorithm flow, 
      // but strictly speaking, low TSAT could still mean functional iron deficiency.
      
      const isDeficient = ferritin < 100 || (tsat !== null && tsat < 20);
      
      useEffect(() => {
        // Set iron status state for later steps
        setIronStatus(isDeficient ? 'deficient' : 'replete');
      }, [isDeficient, setIronStatus]);

      return (
        <div className="space-y-5 animate-fade-in">
          <h3 className="font-bold text-lg text-gray-800 border-b pb-2">Analiz Sonucu</h3>
          
          {/* Patient Summary Card */}
          <div className="bg-white border border-gray-200 rounded-lg p-4 grid grid-cols-3 gap-2 text-center shadow-sm">
            <div>
              <div className="text-xs text-gray-500 uppercase tracking-wide">Hb</div>
              <div className="font-bold text-gray-800 text-lg">{hb}</div>
            </div>
            <div className="border-l border-gray-100">
              <div className="text-xs text-gray-500 uppercase tracking-wide">Ferritin</div>
              <div className={`font-bold text-lg ${ferritin < 100 ? 'text-red-600' : 'text-gray-800'}`}>{ferritin}</div>
            </div>
            <div className="border-l border-gray-100">
              <div className="text-xs text-gray-500 uppercase tracking-wide">TSAT</div>
              <div className={`font-bold text-lg ${tsat !== null && tsat < 20 ? 'text-red-600' : 'text-gray-800'}`}>
                {tsat !== null ? `%${tsat}` : '-'}
              </div>
            </div>
          </div>

          {isDeficient ? (
            <div className="bg-red-50 border-2 border-red-100 rounded-xl p-5 shadow-sm">
              <div className="flex items-center gap-3 mb-3">
                <div className="bg-red-100 p-2 rounded-full">
                  <span data-lucide="alert-circle" className="w-6 h-6 text-red-600"></span>
                </div>
                <h4 className="text-xl font-bold text-red-800">Demir Eksikliği Saptandı</h4>
              </div>
              <p className="text-gray-700 mb-4 text-sm leading-relaxed">
                SUT kriterlerine göre (Ferritin &lt; 100 {tsat !== null && 'veya TSAT < %20'}) hasta demir replasmanı için uygundur.
              </p>
              <button 
                onClick={() => setStep(3)}
                className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg flex items-center justify-center gap-2 transition-colors shadow-md"
              >
                IV Demir Tedavisine Git <span data-lucide="chevron-right" className="w-5 h-5"></span>
              </button>
            </div>
          ) : (
             <div className="bg-green-50 border-2 border-green-100 rounded-xl p-5 shadow-sm">
              <div className="flex items-center gap-3 mb-3">
                <div className="bg-green-100 p-2 rounded-full">
                  <span data-lucide="check-circle" className="w-6 h-6 text-green-600"></span>
                </div>
                <h4 className="text-xl font-bold text-green-800">Demir Depoları Yeterli</h4>
              </div>
              <p className="text-gray-700 mb-4 text-sm leading-relaxed">
                Mevcut verilere göre demir eksikliği kriterleri karşılanmıyor.
                {tsat === null && <span className="block mt-2 text-xs text-gray-500 font-semibold">(Not: TSAT girilmediği için sadece Ferritin değerlendirildi.)</span>}
                <br/>
                Anemi devam ediyorsa ESA veya Roksadustat değerlendirilmelidir.
              </p>
              <button 
                onClick={() => setStep(5)}
                className="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg flex items-center justify-center gap-2 transition-colors shadow-md"
              >
                ESA / Roksadustat Protokolü <span data-lucide="chevron-right" className="w-5 h-5"></span>
              </button>
            </div>
          )}

          {hb > 12 && (
             <div className="bg-yellow-50 p-3 rounded-lg border border-yellow-200 flex items-start gap-2 text-sm text-yellow-800 mt-3">
                <span data-lucide="alert-triangle" className="w-5 h-5 flex-shrink-0 mt-0.5"></span>
                <div>
                  <strong>Uyarı:</strong> Hb &gt; 12 g/dL. SUT'a göre bu düzeyde aktif tedavi genellikle kesilir veya başlanmaz.
                </div>
             </div>
          )}
        </div>
      );
    };

    // Step 3 component (IV Demir Seçimi)
    const Step3 = ({ setStep, setIronDrug }) => (
      <div className="space-y-4 animate-fade-in">
        <h3 className="font-bold text-lg text-gray-800 border-b pb-2">ADIM 3: IV Demir Seçimi</h3>
        <p className="text-sm text-gray-500 mb-2">Hangi ajanı kullanacaksınız?</p>
        <button 
          onClick={() => { setIronDrug('carboxymaltose'); setStep(4); }}
          className="w-full p-4 bg-white border border-gray-200 shadow-sm rounded-lg hover:border-purple-400 hover:shadow-md transition-all text-left relative overflow-hidden"
        >
          <div className="absolute top-0 right-0 bg-purple-100 text-purple-800 text-xs px-2 py-1 rounded-bl-lg font-bold">Hızlı Etki</div>
          <h4 className="font-bold text-gray-800 text-lg">Demir Karboksimaltoz</h4>
          <p className="text-sm text-gray-500">(Inferject®, Ferapplic®)</p>
          <p className="mt-2 text-sm text-gray-600">Prediyaliz/PD için ideal. Daha az seans.</p>
        </button>
        <button 
          onClick={() => { setIronDrug('sucrose'); setStep(4); }}
          className="w-full p-4 bg-white border border-gray-200 shadow-sm rounded-lg hover:border-blue-400 hover:shadow-md transition-all text-left relative overflow-hidden"
        >
          <div className="absolute top-0 right-0 bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded-bl-lg font-bold">Güvenli/Klasik</div>
          <h4 className="font-bold text-gray-800 text-lg">Demir Sükroz</h4>
          <p className="text-sm text-gray-500">(Venofer®, Fericose®, Sükrofer®)</p>
          <p className="mt-2 text-sm text-gray-600">KBH'de en yaygın güvenli ajan.</p>
        </button>
      </div>
    );

    // Step 4 component (Dozlama)
    const Step4 = ({ setStep, ironDrug, patientType, setPatientType }) => {
      if (ironDrug === 'carboxymaltose') {
        return (
          <div className="space-y-4 animate-fade-in">
            <h3 className="font-bold text-lg text-purple-900 border-b pb-2 flex items-center gap-2">
              <span data-lucide="droplet" className="w-5 h-5"></span> Demir Karboksimaltoz
            </h3>
            <div className="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
              <h4 className="font-bold text-gray-800">Dozlama</h4>
              <ul className="list-disc pl-5 mt-2 text-gray-700 space-y-1">
                <li>Tek doz veya haftalık uygulama</li>
                <li><strong>Maksimum:</strong> 1000 mg/hafta</li>
                <li><strong>Toplam Doz:</strong> Genellikle 1000 mg</li>
              </ul>
            </div>
            <div className="bg-red-50 p-4 rounded-lg border border-red-200">
              <h4 className="font-bold text-red-800 flex items-center gap-2">
                <span data-lucide="alert-triangle" className="w-5 h-5"></span> DİKKAT: 6H SENDROMU
              </h4>
              <p className="text-sm text-red-700 mt-1 mb-2">High FGF-23 kaynaklı Hipofosfatemi riski.</p>
            </div>
            <button 
              onClick={() => setStep(5)}
              className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg mt-4 flex items-center justify-center gap-2"
            >
              Tedavi Sonrası & ESA/Roksadustat <span data-lucide="chevron-right" className="w-5 h-5"></span>
            </button>
          </div>
        );
      }
      // Iron sucrose
      return (
        <div className="space-y-4 animate-fade-in">
          <h3 className="font-bold text-lg text-blue-900 border-b pb-2 flex items-center gap-2">
            <span data-lucide="droplet" className="w-5 h-5"></span> Demir Sükroz Protokolü
          </h3>
          {!patientType ? (
            <div className="space-y-3">
              <p className="text-gray-600 font-medium">Hasta tipi seçiniz:</p>
              <button onClick={() => setPatientType('HD')} className="w-full p-3 text-left bg-red-50 hover:bg-red-100 text-red-800 rounded font-semibold border border-red-200">🔴 Hemodiyaliz (HD)</button>
              <button onClick={() => setPatientType('PD')} className="w-full p-3 text-left bg-blue-50 hover:bg-blue-100 text-blue-800 rounded font-semibold border border-blue-200">🔵 Periton Diyalizi (PD)</button>
              <button onClick={() => setPatientType('CKD')} className="w-full p-3 text-left bg-green-50 hover:bg-green-100 text-green-800 rounded font-semibold border border-green-200">🔶 Diyalize Girmeyen KBH</button>
            </div>
          ) : (
            <div className="bg-white p-5 rounded-lg border-l-4 border-blue-500 shadow-sm">
              {patientType === 'HD' && (
                <>
                  <h4 className="font-bold text-xl text-red-600 mb-2">Hemodiyaliz Protokolü</h4>
                  <div className="text-lg font-medium text-gray-800">100 mg IV</div>
                  <p className="text-gray-600">Ardışık diyaliz seanslarında. Toplam: 1000 mg.</p>
                </>
              )}
              {patientType === 'PD' && (
                <>
                  <h4 className="font-bold text-xl text-blue-600 mb-2">Periton Diyalizi Protokolü</h4>
                  <div className="text-gray-800">300 mg → 300 mg → 400 mg (14 gün arayla)</div>
                </>
              )}
              {patientType === 'CKD' && (
                <>
                  <h4 className="font-bold text-xl text-green-600 mb-2">Diyalize Girmeyen KBH</h4>
                  <div className="text-lg font-medium text-gray-800">200 mg IV (5 doz)</div>
                </>
              )}
              <button 
                onClick={() => setPatientType(null)}
                className="mt-4 text-xs text-blue-500 underline"
              >
                Hasta tipini değiştir
              </button>
            </div>
          )}
          {patientType && (
            <button 
              onClick={() => setStep(5)}
              className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg mt-4 flex items-center justify-center gap-2"
            >
              Tedavi Sonrası & ESA/Roksadustat <span data-lucide="chevron-right" className="w-5 h-5"></span>
            </button>
          )}
        </div>
      );
    };

    // Step 5 component (SUT Başlama & Seçim)
    const Step5 = ({ setStep, setTreatmentType }) => (
      <div className="space-y-4 animate-fade-in">
        <div className="bg-orange-50 p-4 rounded-lg border border-orange-200 shadow-sm">
          <h3 className="font-bold text-orange-900 flex items-center gap-2 text-lg">
            <span data-lucide="file-text" className="w-5 h-5"></span> SUT Başlama Kriterleri
          </h3>
          <div className="mt-3 space-y-2 text-sm text-orange-900">
            <div className="flex items-start gap-2">
              <span data-lucide="check-circle" className="w-4 h-4 mt-0.5 text-orange-600"></span>
              <span><strong>Demir Yeterli:</strong> TSAT ≥ %20 ve/veya Ferritin ≥ 100 olmalı.</span>
            </div>
            <div className="flex items-start gap-2">
              <span data-lucide="check-circle" className="w-4 h-4 mt-0.5 text-orange-600"></span>
              <span><strong>Başlangıç Hb:</strong> &lt; 10 g/dL</span>
            </div>
            <div className="flex items-start gap-2">
              <span data-lucide="info" className="w-4 h-4 mt-0.5 text-blue-600"></span>
              <span><strong>Hedef Hb:</strong> 11 - 12 g/dL</span>
            </div>
            <div className="flex items-start gap-2 font-bold text-red-600 bg-white p-2 rounded">
              <span data-lucide="alert-triangle" className="w-4 h-4 mt-0.5"></span>
              <span>Hb &gt; 12 g/dL olunca tedavi KESİLİR.</span>
            </div>
          </div>
        </div>
        <h4 className="font-bold text-gray-800 mt-2">Tedavi Seçimi:</h4>
        <button 
          onClick={() => { setTreatmentType('ROXA'); setStep(6); }}
          className="w-full p-4 bg-white border-2 border-purple-100 hover:border-purple-500 rounded-lg shadow-sm group transition-all text-left"
        >
          <div className="font-bold text-purple-800 text-lg flex justify-between">
            Roksadustat (HIF-PH İnhibitörü)
            <span className="text-xs bg-purple-100 px-2 py-1 rounded text-purple-800">Oral Tablet</span>
          </div>
          <p className="text-xs text-gray-500 mt-1">Diyaliz hastaları (HD/PD) için endike.</p>
        </button>
        <button 
          onClick={() => { setTreatmentType('ESA'); setStep(6); }}
          className="w-full p-4 bg-white border-2 border-blue-100 hover:border-blue-500 rounded-lg shadow-sm group transition-all text-left"
        >
          <div className="font-bold text-blue-800 text-lg flex justify-between">
            Klasik ESA Tedavisi
            <span className="text-xs bg-blue-100 px-2 py-1 rounded text-blue-800">SC / IV</span>
          </div>
          <p className="text-xs text-gray-500 mt-1">Darbepoetin, Epoetin alfa/beta/zeta...</p>
        </button>
      </div>
    );

    // Step 6 component (Doz Hesaplama)
    const Step6 = ({ treatmentType, setStep, resetAlgorithm }) => {
      const [weight, setWeight] = useState(null);
      const [patientStatus, setPatientStatus] = useState(null);

      if (treatmentType === 'ROXA') {
        return (
          <div className="space-y-4 animate-fade-in">
            <h3 className="font-bold text-lg text-purple-900 border-b pb-2 flex items-center gap-2">
              <span data-lucide="pill" className="w-5 h-5"></span> Roksadustat SUT Kuralları
            </h3>
            {!patientStatus ? (
              <div className="space-y-3">
                <p className="text-sm font-bold text-gray-700">Hasta durumu nedir?</p>
                <button onClick={() => setPatientStatus('naive')} className="w-full p-3 bg-purple-50 hover:bg-purple-100 text-purple-900 rounded border border-purple-200 font-semibold text-left">
                  🆕 ESA Naive (Şu an ESA almıyor)
                </button>
                <button onClick={() => setPatientStatus('switch')} className="w-full p-3 bg-gray-50 hover:bg-gray-100 text-gray-700 rounded border border-gray-200 font-semibold text-left">
                  🔄 Stabil ESA Hastası (Geçiş)
                </button>
              </div>
            ) : (
              <>
                {patientStatus === 'switch' ? (
                  <div className="bg-yellow-50 p-4 border-l-4 border-yellow-500 text-yellow-800 text-sm">
                    <strong className="block mb-2 text-lg">⚠️ SUT Uyarısı</strong>
                    Sadece <strong>geçerli bir klinik neden</strong> olması ve raporda belirtilmesi halinde geçiş yapılabilir.
                    <br/><br/>
                    Başlangıç dozu: Önceki 4 haftalık ortalama ESA dozuna göre (KÜB'e bakınız).
                  </div>
                ) : (
                  <div className="space-y-4">
                    {!weight ? (
                      <div className="space-y-3">
                        <p className="text-sm font-bold text-gray-700 flex items-center gap-2">
                          <span data-lucide="scale" className="w-4 h-4"></span> Hasta Ağırlığı:
                        </p>
                        <button onClick={() => setWeight('under100')} className="w-full p-3 bg-white border hover:border-purple-500 rounded shadow-sm text-center font-bold text-gray-700">
                          &lt; 100 kg
                        </button>
                        <button onClick={() => setWeight('over100')} className="w-full p-3 bg-white border hover:border-purple-500 rounded shadow-sm text-center font-bold text-gray-700">
                          ≥ 100 kg
                        </button>
                      </div>
                    ) : (
                      <div className="bg-purple-600 text-white p-6 rounded-lg shadow-lg text-center animate-fade-in">
                        <div className="text-sm opacity-80 mb-1">Başlangıç Dozu</div>
                        <div className="text-4xl font-bold mb-2">
                          {weight === 'under100' ? '70 mg' : '100 mg'}
                        </div>
                        <div className="text-lg font-medium bg-purple-700 rounded py-1">Haftada 3 kez</div>
                      </div>
                    )}
                  </div>
                )}
                {(weight || patientStatus === 'switch') && (
                  <div className="mt-4 bg-gray-50 p-3 rounded text-xs text-gray-600 space-y-2 border">
                    <p>🚠 <strong>Reçete:</strong> Bir defada en fazla 1 aylık.</p>
                    <p>📊 <strong>Takip (Demir):</strong> HD 3 ayda bir, PD 4 ayda bir TSAT/Ferritin bak. Raporda tarih/sonuç belirt.</p>
                    <p>🎯 <strong>Hedef:</strong> Hb 11-12 arası tut. &gt;12 ise kes.</p>
                  </div>
                )}
                {(weight || patientStatus === 'switch') && (
                  <div className="flex gap-2 mt-4">
                    <button onClick={() => { setWeight(null); setPatientStatus(null); }} className="flex-1 py-2 text-gray-500 text-sm underline">Geri</button>
                    <button onClick={resetAlgorithm} className="flex-1 bg-gray-800 text-white py-2 rounded">Başa Dön</button>
                  </div>
                )}
              </>
            )}
          </div>
        );
      }
      // ESA treatment
      return (
        <div className="space-y-4 animate-fade-in">
          <h3 className="font-bold text-lg text-blue-900 border-b pb-2 flex items-center gap-2">
            <span data-lucide="pill" className="w-5 h-5"></span> Klasik ESA Dozları
          </h3>
          <div className="space-y-3">
            <div className="bg-white p-3 border border-blue-200 rounded-lg shadow-sm">
              <h4 className="font-bold text-blue-800 text-sm mb-1 flex justify-between">
                Darbepoetin alfa
                <span className="text-xs font-normal bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full">Aranesp®</span>
              </h4>
              <p className="text-xs text-gray-500 mb-2">Uzun etkili (Haftada 1 veya 2 haftada 1)</p>
              <div className="grid grid-cols-2 gap-2 text-xs mb-2">
                <div className="bg-blue-50 p-2 rounded">
                  <span className="block font-bold text-blue-900">Başlangıç</span>
                  0.25 - 0.75 mcg/kg/hf
                </div>
                <div className="bg-green-50 p-2 rounded">
                  <span className="block font-bold text-green-900">İdame</span>
                  0.13 - 0.35 mcg/kg/hf
                </div>
              </div>
              <div className="flex items-center gap-2 bg-gray-800 text-white p-2 rounded text-xs">
                <span data-lucide="calculator" className="w-3 h-3 text-yellow-400 flex-shrink-0"></span>
                <div>
                  <div className="flex justify-between gap-4">
                    <span><strong>70 kg Başlangıç:</strong> 17.5 - 52.5 mcg</span>
                  </div>
                  <div className="flex justify-between gap-4 mt-0.5 border-t border-gray-600 pt-0.5">
                    <span><strong>70 kg İdame:</strong> 9.1 - 24.5 mcg</span>
                  </div>
                </div>
              </div>
            </div>
            <div className="bg-white p-3 border border-blue-200 rounded-lg shadow-sm">
              <h4 className="font-bold text-blue-800 text-sm mb-1 flex flex-col">
                Eritropoietin alfa / beta / zeta
                <span className="text-xs font-normal text-gray-500 mt-0.5">Eprex®, Eporon®, Dropoetin®, Binocrit®, Neo-Recormon®</span>
              </h4>
              <div className="grid grid-cols-2 gap-2 text-xs mb-2">
                <div className="bg-blue-50 p-2 rounded">
                  <span className="block font-bold text-blue-900">Başlangıç</span>
                  50-150 IU/kg/hafta
                </div>
                <div className="bg-green-50 p-2 rounded">
                  <span className="block font-bold text-green-900">İdame</span>
                  25-75 IU/kg/hafta
                </div>
              </div>
              <div className="flex items-center gap-2 bg-gray-800 text-white p-2 rounded text-xs">
                <span data-lucide="calculator" className="w-3 h-3 text-yellow-400"></span>
                <div>
                  <strong>70 kg için:</strong> 3.500 - 10.500 IU/hafta
                  <div className="text-gray-300 text-[10px]">(Genelde haftada 3 x 2000 IU)</div>
                </div>
              </div>
            </div>
            <div className="bg-white p-3 border border-blue-200 rounded-lg shadow-sm">
              <h4 className="font-bold text-blue-800 text-sm mb-1 flex justify-between">
                Metoksipolietilen glikol epoetin beta
                <span className="text-xs font-normal bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full">Mircera®</span>
              </h4>
              <p className="text-xs text-gray-500 mb-2">Çok uzun etkili (Ayda 1 veya 2 haftada 1)</p>
              <div className="grid grid-cols-2 gap-2 text-xs mb-2">
                <div className="bg-blue-50 p-2 rounded">
                  <span className="block font-bold text-blue-900">Başlangıç</span>
                  0.4 - 0.94 mcg/kg <br/>(2 haftada 1)
                </div>
                <div className="bg-green-50 p-2 rounded">
                  <span className="block font-bold text-green-900">İdame</span>
                  0.8 - 1.88 mcg/kg <br/>(Ayda 1)
                </div>
              </div>
              <div className="flex items-center gap-2 bg-gray-800 text-white p-2 rounded text-xs">
                <span data-lucide="calculator" className="w-3 h-3 text-yellow-400"></span>
                <div>
                  <strong>70 kg için:</strong> 28 - 65 mcg (2 haftada bir)
                  <div className="text-gray-300 text-[10px]">(Pratikte 50 mcg başlanır)</div>
                </div>
              </div>
            </div>
          </div>
          <div className="bg-red-50 p-3 rounded text-xs text-red-800 border border-red-200 mt-2">
            <strong className="block mb-1">🚫 Kritik SUT Kuralları:</strong>
            <ul className="list-disc pl-4 space-y-1">
              <li>Bir defada <strong>en fazla 1 aylık</strong> ilaç verilir.</li>
              <li>Hb &gt; 12 g/dL olunca <strong>tedavi kesilir.</strong></li>
              <li>Hb 11-12 arasına düşünce <strong>idame dozdan</strong> tekrar başlanır.</li>
              <li>TSAT &gt; %20 ve Ferritin &gt; 100 olmalıdır (Tedavi boyunca).</li>
            </ul>
          </div>
          <button onClick={resetAlgorithm} className="w-full bg-gray-800 hover:bg-black text-white py-3 rounded mt-2 flex items-center justify-center gap-2">
            <span data-lucide="rotate-ccw" className="w-4 h-4"></span> Başa Dön
          </button>
        </div>
      );
    };

    // Main App component
    const App = () => {
      const [step, setStep] = useState(1);
      const [patientData, setPatientData] = useState({});
      const [ironStatus, setIronStatus] = useState(null);
      const [patientType, setPatientType] = useState(null);
      const [ironDrug, setIronDrug] = useState(null);
      const [treatmentType, setTreatmentType] = useState(null);

      const resetAlgorithm = () => {
        setStep(1);
        setPatientData({});
        setIronStatus(null);
        setPatientType(null);
        setIronDrug(null);
        setTreatmentType(null);
      };

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      return (
        <div className="min-h-screen bg-gray-100 p-4 font-sans flex items-center justify-center">
          <div className="bg-white max-w-md w-full rounded-xl shadow-xl overflow-hidden flex flex-col min-h-[600px]">
            <div className="bg-slate-900 p-4 text-white flex justify-between items-center">
              <div>
                <h1 className="text-xl font-bold flex items-center gap-2">
                  <span data-lucide="pill" className="w-5 h-5 text-blue-400"></span> KBH Anemi (SUT)
                </h1>
                <p className="text-xs text-gray-400">Demir + ESA + Roksadustat</p>
              </div>
              {step > 1 && (
                <button onClick={resetAlgorithm} className="text-gray-400 hover:text-white">
                  <span data-lucide="rotate-ccw" className="w-5 h-5"></span>
                </button>
              )}
            </div>
            <div className="h-2 bg-gray-200 w-full">
              <div 
                className="h-full bg-blue-500 transition-all duration-500 ease-in-out" 
                style={{ width: `${(step / 6) * 100}%` }}
              ></div>
            </div>
            <div className="p-5 flex-grow overflow-y-auto">
              {step === 1 && <Step1 setStep={setStep} setPatientData={setPatientData} />}
              {step === 2 && <Step2 setStep={setStep} patientData={patientData} setIronStatus={setIronStatus} />}
              {step === 3 && <Step3 setStep={setStep} setIronDrug={setIronDrug} />}
              {step === 4 && <Step4 setStep={setStep} ironDrug={ironDrug} patientType={patientType} setPatientType={setPatientType} />}
              {step === 5 && <Step5 setStep={setStep} setTreatmentType={setTreatmentType} />}
              {step === 6 && <Step6 treatmentType={treatmentType} setStep={setStep} resetAlgorithm={resetAlgorithm} />}
            </div>
            <div className="bg-gray-50 p-3 text-center text-xs text-gray-500 border-t">
              SUT Kuralları ile güncellenmiştir. Hekim görüşü esastır.
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
